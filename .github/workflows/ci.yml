name: CPU tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate the release manifest
        run: |
          python -c "from pathlib import Path; from scripts.release.release_utils import validate_manifest; validate_manifest(Path('.')); print('Release manifest verified')"
          python scripts/release/check_release.py --root . --kind code
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Run the structural-support example
        run: python examples/structural_support_demo.py
